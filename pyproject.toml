[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ne_cells"
version = "2.1.0"
description = "Nutzungseinheit cells: deterministic H3-cell statistics from the Austrian cadastre (algo ne-cells-2)"
requires-python = ">=3.11"
# PINNED: bit-identity across peers depends on the bundled GEOS in this exact shapely wheel.
dependencies = ["shapely==2.1.2", "h3==4.5.0"]

[tool.setuptools]
packages = ["ne_cells"]
